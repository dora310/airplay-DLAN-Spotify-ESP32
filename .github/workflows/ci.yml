name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Install clang-format
        run: |
          python3 -m pip install --user -r requirements-dev.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format source for CI
        run: bash scripts/format.sh

  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Restore cspot generator permissions
        shell: bash
        run: |
          chmod +x \
            components/cspot_embedded/cspot/bell/external/nanopb/generator/protoc \
            components/cspot_embedded/cspot/bell/external/nanopb/generator/protoc-gen-nanopb \
            components/cspot_embedded/cspot/bell/external/nanopb/generator/nanopb_generator.py

      - name: Prepare protoc 3.20.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-tools/protoc
          mkdir -p .ci-tools/protoc
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/protoc-3.20.3.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-linux-x86_64.zip
          python3 -m zipfile -e \
            "$RUNNER_TEMP/protoc-3.20.3.zip" \
            .ci-tools/protoc
          chmod +x .ci-tools/protoc/bin/protoc
          .ci-tools/protoc/bin/protoc --version

      - name: Build and generate compile_commands.json
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          command: >
            export PATH="$PWD/.ci-tools/protoc/bin:$PATH" &&
            protoc --version &&
            python -m pip install --no-cache-dir "protobuf==3.20.3" "setuptools<81" &&
            IDF_PY_BUILD_JOBS=2 idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Run clang-tidy
        run: |
          COMPILE_DB="build"
          WARNINGS=0
          while IFS= read -r -d '' file; do
            echo "Checking $file..."
            OUTPUT=$(clang-tidy -p "$COMPILE_DB" "$file" 2>&1 || true)
            FILTERED=$(echo "$OUTPUT" | grep -v "file not found \[clang-diagnostic" || true)
            if echo "$FILTERED" | grep -q ": warning:"; then
              echo "$FILTERED" | grep -E "(: warning:|: note:)"
              WARNINGS=1
            fi
          done < <(find main components \( -path components/u8g2 -o -path components/cspot_embedded/cspot \) -prune -o \( -name "*.c" -o -name "*.h" \) -print0)
          if [ "$WARNINGS" -ne 0 ]; then
            echo ""
            echo "clang-tidy found issues"
            exit 1
          fi
          echo "All files pass clang-tidy checks"

  build:
    needs: [format-check, lint-check]
    uses: ./.github/workflows/build.yml
    secrets: inherit
